<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Olyra URL</title><link rel="icon" href="https://htmlhoster.com/p/Z1XHW2WY/OlyraSearchLogo.svg"><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><img src="https://htmlhoster.com/p/Z1XHW2WY/OlyraSearchLogo.svg" alt=""> olyra</a><a class="outline" href="/tools/">All tools ↗</a></header><main class="tool-page"><p class="eyebrow"><b></b> Olyra URL</p><h1>Make it<br><em>shareable.</em></h1><p class="lede">Shorten a link and turn it into a custom QR code. No account required.</p><form id="shortener"><label for="url">Your long URL</label><div class="form-row"><input id="url" type="url" placeholder="https://example.com/a-very-long-link" required><button type="submit">Shorten ↗</button></div><p id="result" role="status"></p></form><div id="qr" class="qr"></div></main><script>const form=document.querySelector('#shortener'),result=document.querySelector('#result'),qr=document.querySelector('#qr');form.addEventListener('submit',async e=>{e.preventDefault();result.textContent='Working...';try{const r=await fetch('/api/shorten',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value})});const d=await r.json();if(!r.ok)throw Error(d.error);result.innerHTML='<a href="'+d.shortUrl+'" target="_blank" rel="noreferrer">'+d.shortUrl+' ↗</a>';qr.innerHTML='<img alt="QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(d.shortUrl)+'">'}catch(err){result.textContent=err.message}});</script></body></html>
